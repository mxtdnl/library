name: Sync projects

# Discovers new GitHub Pages repos and, when the catalogue changes, opens a pull
# request adding them to the "New" inbox in projects.json. Nothing reaches the
# live site until you review the PR and write a proper description.

on:
  schedule:
    - cron: "0 6 * * 2,5"   # Tuesdays and Fridays, 06:00 UTC
  workflow_dispatch:        # plus a manual "Run workflow" button

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run the sync
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Models (the old in-workflow drafter) has been retired, so skip
          # the AI call here. New repos land as TODO placeholders in the NEW inbox;
          # the "Draft blurbs" Routine (Claude/Sonnet, ~4h later) fills them in.
          SYNC_NO_AI: "1"
        run: node scripts/sync-projects.mjs

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="bot/sync-projects"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add projects.json
          git commit -m "Sync projects catalogue

          Added: ${{ steps.sync.outputs.added_list || 'metadata only' }}"
          # bot/sync-projects is a throwaway branch this workflow fully owns and
          # rebuilds from the default branch each run, so a plain force is correct.
          # (--force-with-lease needs a remote-tracking ref the shallow checkout
          # doesn't have, and rejects with "stale info".)
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH — updated with a new commit."
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "Sync projects catalogue" \
              --body "Automated update from \`scripts/sync-projects.mjs\`.

          **Newly discovered:** ${{ steps.sync.outputs.added_list || '_none — metadata/date changes only_' }}

          New repos are added to the **New — awaiting a description** collection as
          \`TODO\` placeholders. The **Draft blurbs** Routine (Claude/Sonnet) runs a
          few hours after this workflow, reads each new repo's page, and fills in a
          real blurb, collection, tags and subtitle on this same PR. If you're
          reading this before that has happened, the entries may still say \`TODO\`.
          Anything flagged \`\"stale\": true\` is a project whose Pages site has gone
          offline — fix or remove it."
          fi
